[project]
name = "capscope"
version = "0.1.0"
description = "Diagnose which parts of a trained neural network have run out of representational capacity."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "playwright>=1.40"]

[project.scripts]
capscope = "capscope.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.uv]
dev-dependencies = ["pytest>=7", "playwright>=1.40"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
