<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>capscope</title>
<style>
:root {
  --bg: #0b0f17; --panel: #111827; --panel2: #161e2e; --line: #253045; --line2: #334155;
  --text: #e5e7eb; --muted: #94a3b8; --dim: #64748b; --accent: #60a5fa;
  --saturated: #ef4444; --tight: #f59e0b; --spare: #22c55e; --upstream: #3b82f6;
  --undertrained: #a855f7; --redundant: #ec4899; --oversmoothed: #06b6d4;
  --passthrough: #6b7280; --narrow: #94a3b8; --none: #475569;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--sans); overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
select, input[type=text] { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 4px 8px; }
a { color: var(--accent); }

#app { display: grid; grid-template-rows: 48px auto auto 1fr; height: 100vh; }
header { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .brand { font-weight: 700; letter-spacing: .5px; font-size: 15px; }
header .brand span { color: var(--accent); }
header .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
header .tabs { display: flex; gap: 4px; margin-left: 10px; }
header .spacer { flex: 1; }
header .ctrl { display: flex; gap: 6px; align-items: center; color: var(--muted); }
header label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
#warnbox { display: none; background: #3b1d1d; color: #fecaca; border-bottom: 1px solid #7f1d1d; padding: 6px 14px; font-size: 12px; }
#warnbox.show { display: block; }
#warnbox div + div { margin-top: 4px; }
#headline { display: none; background: #12233d; color: #bfdbfe; border-bottom: 1px solid #1e3a8a; padding: 6px 14px; font-size: 12px; line-height: 1.45; }
#headline.show { display: block; }
#headline b { color: #fff; }
.srtext { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
table.sweep { border-collapse: collapse; font-family: var(--mono); font-size: 11px; margin: 4px 0 6px; }
table.sweep th, table.sweep td { padding: 2px 8px; text-align: right; border-bottom: 1px solid #1a2233; color: var(--muted); }
table.sweep th { color: var(--dim); font-weight: 600; }
table.sweep td.ok { color: #22c55e; }
table.sweep td.no { color: #ef4444; }
table.sweep tr.used td { color: #fbbf24; }

main { display: grid; grid-template-columns: var(--leftw, 340px) 6px 1fr 6px var(--rightw, 420px); min-height: 0; }
aside, section { min-height: 0; overflow: hidden; }
#left { border-right: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
#right { border-left: 1px solid var(--line); overflow-y: auto; background: var(--panel); padding: 12px 14px 40px; }
.gutter { cursor: col-resize; background: var(--bg); position: relative; }
.gutter::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: var(--line); }
.gutter:hover::after, body.resizing .gutter::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
/* detail panel moved below the graph: the page scrolls, the panel spans the width */
#below { display: none; border-top: 1px solid var(--line); background: var(--panel); overflow: visible; min-height: 0; }
body.below { overflow: auto; }
body.below #app { height: auto; min-height: 100vh; grid-template-rows: 48px auto auto minmax(360px, 58vh) auto; }
html.below, body.below { height: auto; }
body.below main { grid-template-columns: var(--leftw, 340px) 6px 1fr; }
body.below #gutR { display: none; }
body.below #below { display: block; }
body.below #right { border-left: 0; overflow: visible; max-width: none; margin: 0; padding: 14px 24px 80px; }
body.below #right .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
body.below #right .charts2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
body.below #right .chart svg { max-height: 260px; margin: 0 auto; }
#center { position: relative; background: radial-gradient(circle at 50% 50%, #0f1522 0, #0b0f17 100%); }
#graph { width: 100%; height: 100%; display: block; cursor: grab; }
#graph.dragging { cursor: grabbing; }
#heat { display: none; width: 100%; height: 100%; overflow: auto; padding: 12px; }
#heat.show { display: block; }
#center.heat #graph { display: none; }
#graphtools { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
#legend { position: absolute; bottom: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11px; color: var(--muted); max-width: 90%; }
#legend span i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* module list */
#listtools { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
#listtools input { flex: 1; min-width: 0; }
#list { overflow-y: auto; flex: 1; }
table.mods { width: 100%; border-collapse: collapse; font-size: 12px; }
table.mods th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 600; text-align: left; padding: 6px 8px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.mods th.sorted { color: var(--accent); }
table.mods td { padding: 5px 8px; border-bottom: 1px solid #1a2233; white-space: nowrap; vertical-align: middle; }
table.mods tr { cursor: pointer; }
table.mods tr:hover td { background: #1a2333; }
table.mods tr.sel td { background: #1e3a8a55; }
table.mods td.name { font-family: var(--mono); max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
table.mods td.num { text-align: right; font-family: var(--mono); color: var(--muted); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10.5px; font-weight: 600; color: #0b0f17; letter-spacing: .2px; }
.bar { display: inline-block; width: 60px; height: 8px; background: #1f2937; border-radius: 3px; overflow: hidden; vertical-align: middle; }
.bar i { display: block; height: 100%; }

/* detail */
#right h2 { margin: 0 0 2px; font-size: 16px; font-family: var(--mono); word-break: break-all; }
#right .sub { color: var(--muted); margin-bottom: 8px; }
#right .sentence { background: var(--panel2); border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; margin: 8px 0 12px; line-height: 1.5; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-bottom: 12px; }
.grid .k { color: var(--dim); font-size: 11px; }
.grid .v { font-family: var(--mono); font-size: 12px; }
.grid .cell { padding: 4px 6px; background: #0f1522; border-radius: 4px; }
.grid .d { color: var(--dim); font-size: 10px; line-height: 1.3; margin-top: 2px; }
#right h3 { font-size: 12px; color: var(--muted); margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .6px; }
.sec { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; background: #0d1320; }
.sec > .sech { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; user-select: none; }
.sec > .sech:hover { background: #131b2b; }
.sec > .sech .tri { color: var(--dim); font-size: 10px; width: 10px; transition: transform .12s; }
.sec.closed > .sech .tri { transform: rotate(-90deg); }
.sec > .sech h3 { margin: 0; flex: 1; }
.sec > .sech .sum { color: var(--dim); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
.sec > .sech .help { color: var(--dim); border: 1px solid var(--line2); border-radius: 50%; width: 16px; height: 16px; font-size: 10px; line-height: 14px; text-align: center; flex: none; }
.sec > .sech .help:hover { color: var(--accent); border-color: var(--accent); }
.sec > .secb { padding: 6px 10px 8px; border-top: 1px solid var(--line); }
.sec.closed > .secb { display: none; }
.sec .grid { margin-bottom: 6px; }
.sec .chart { margin-bottom: 4px; }
/* panel below: equal-width cards in a fixed column grid, draggable to reorder */
body.below #right .secs { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 12px; align-items: start; }
body.below #right .sec { margin: 0; min-width: 0; }
body.below #right .sec.wide { grid-column: span 2; }
body.below #right .sec .charts2 { grid-template-columns: 1fr 1fr; }
body.below #right .sec.wide .charts2 { grid-template-columns: 1fr 1fr; }
body.below #right .sec .grid { grid-template-columns: 1fr 1fr; }
body.below #right .sec.wide .grid { grid-template-columns: repeat(4, 1fr); }
body.below #right .chart svg { max-height: 300px; margin: 0 auto; }
body.below #right .sec.wide .chart svg { max-height: 340px; }
@media (max-width: 1000px) { body.below #right .secs { --cols: 1; } body.below #right .sec.wide { grid-column: auto; } }
.sec > .sech .grip { color: var(--dim); cursor: grab; font-size: 13px; letter-spacing: -2px; flex: none; padding: 0 2px; }
.sec.dragging { opacity: .4; }
.sec.dropbefore { box-shadow: -3px 0 0 var(--accent); }
.sec.dropafter { box-shadow: 3px 0 0 var(--accent); }
.sec.dropbefore.col, .sec.dropafter.col { box-shadow: none; }
.sec.dropbefore.col { box-shadow: 0 -3px 0 var(--accent); }
.sec.dropafter.col { box-shadow: 0 3px 0 var(--accent); }
#secTools { display: flex; gap: 6px; align-items: center; margin: 2px 0 8px; color: var(--dim); font-size: 11px; }
/* guide text embedded in each section (panel-below mode only) */
.explain { display: none; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 6px; font-size: 12.5px; line-height: 1.5; color: var(--muted); }
body.below .explain { display: block; }
.explain summary { cursor: pointer; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; user-select: none; }
.explain summary:hover { color: var(--accent); }
.explain p { margin: 6px 0; }
.explain table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; }
.explain th { text-align: left; color: var(--dim); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line2); }
.explain td { padding: 4px 6px; border-bottom: 1px solid #1a2233; vertical-align: top; }
.explain code, .explain pre { font-family: var(--mono); font-size: 11.5px; background: #0f1522; border-radius: 4px; }
.explain code { padding: 0 3px; }
.explain pre { padding: 6px 10px; overflow-x: auto; }
.explain ul, .explain ol { padding-left: 20px; margin: 4px 0; }
#secTools button { padding: 2px 8px; font-size: 11px; }
/* chart hover */
.chart svg { cursor: crosshair; }
.chart .xh { stroke: #e5e7eb; stroke-width: .8; stroke-dasharray: 2 2; opacity: 0; pointer-events: none; }
.chart .xm { fill: #fbbf24; opacity: 0; pointer-events: none; }
.chart .hoverpad { fill: transparent; }
.chart { background: #0f1522; border-radius: 6px; padding: 4px; margin-bottom: 6px; }
.chart svg { display: block; width: 100%; height: auto; }
.charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.nb { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
.nb:hover { background: #1a2333; }
.nb .n { font-family: var(--mono); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb .r { color: var(--dim); font-size: 10px; }
.nb .val { font-family: var(--mono); width: 44px; text-align: right; }
.empty { color: var(--dim); font-style: italic; padding: 10px 0; }
.axis text { fill: var(--dim); font-size: 9px; font-family: var(--mono); }
.axis line, .axis path { stroke: var(--line2); }
@media (max-width: 820px) { main { grid-template-columns: 1fr !important; grid-template-rows: 32vh 1fr 36vh; } .gutter { display: none; } #left, #right { border: 0; border-bottom: 1px solid var(--line); } header .meta { display: none; } }
#tip { position: fixed; pointer-events: none; background: #0b0f17; border: 1px solid var(--line2); padding: 6px 8px; border-radius: 6px; font-size: 11px; font-family: var(--mono); display: none; z-index: 10; max-width: 320px; white-space: pre; }
.hint { color: var(--dim); font-size: 11px; padding: 6px 10px; }
/* guide modal */
#guide { display: none; position: fixed; inset: 0; z-index: 20; background: #0b0f17ee; }
#guide.show { display: block; }
#guide .box { position: absolute; inset: 24px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
#guide .top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
#guide .top h1 { margin: 0; font-size: 15px; flex: 1; }
#guide .top .sub { color: var(--muted); font-size: 12px; }
#guide .body { overflow-y: auto; padding: 8px 28px 40px; font-size: 13.5px; line-height: 1.55; }
#guide .body > * { max-width: 1000px; margin-left: auto; margin-right: auto; }
#guide h2 { font-size: 15px; margin: 26px auto 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--accent); }
#guide p, #guide li { color: var(--text); }
#guide .g-lead p { color: var(--muted); }
#guide table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 8px auto 12px; }
#guide th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line2); vertical-align: bottom; }
#guide td { padding: 6px 8px; border-bottom: 1px solid #1a2233; vertical-align: top; }
#guide code, #guide pre { font-family: var(--mono); font-size: 12px; background: #0f1522; border-radius: 4px; }
#guide code { padding: 1px 4px; }
#guide pre { padding: 8px 12px; overflow-x: auto; }
#guide ul, #guide ol { padding-left: 22px; }
#guide li + li { margin-top: 4px; }
@media (max-width: 820px) { #guide .box { inset: 8px; } #guide .body { padding: 8px 14px 30px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">cap<span>scope</span></div>
    <div class="meta" id="meta"></div>
    <div class="tabs">
      <button id="tab-graph" class="active">Dataflow graph</button>
      <button id="tab-heat">Similarity (CKA)</button>
    </div>
    <div class="spacer"></div>
    <div class="ctrl">
      <label><input type="checkbox" id="leavesOnly"> leaves only</label>
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
      <button id="moveDetail" title="Show the detail panel as a full-width section below the graph instead of a sidebar">Panel below</button>
      <button id="guideBtn" title="How to read every metric and verdict (Esc closes)">Guide</button>
    </div>
  </header>
  <div id="warnbox"></div>
  <div id="headline"></div>
  <main>
    <aside id="left">
      <div id="listtools">
        <input type="text" id="search" placeholder="filter modules…">
        <select id="sort">
          <option value="priority">growth priority</option>
          <option value="exec_order">execution order</option>
          <option value="used_frac">dimensions used</option>
          <option value="n_params_total">parameter count</option>
        </select>
      </div>
      <div id="list"></div>
      <div class="hint">Click a row to select. Scroll to zoom the graph, drag to pan, ± to collapse/expand.</div>
    </aside>
    <div class="gutter" id="gutL" title="Drag to resize"></div>
    <section id="center">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#64748b"></path>
          </marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"></path>
          </marker>
        </defs>
        <g id="viewport"></g>
      </svg>
      <div id="heat"></div>
      <div id="graphtools"><button id="fit">Fit</button></div>
      <div id="legend"></div>
    </section>
    <div class="gutter" id="gutR" title="Drag to resize"></div>
    <aside id="right"><div class="empty">Select a module.</div></aside>
  </main>
  <section id="below"></section>
</div>
<div id="tip"></div>
<div id="guide" role="dialog" aria-modal="true" aria-labelledby="guideTitle">
  <div class="box">
    <div class="top"><h1 id="guideTitle">capscope metrics: how to read each one</h1><span class="sub">Esc or click outside to close</span><button id="guideClose">Close</button></div>
    <div class="body">
<!--__CAPSCOPE_GUIDE__-->
    </div>
  </div>
</div>
<script>
const DATA = /*__CAPSCOPE_DATA__*/null;
(function () {
'use strict';
if (!DATA) { document.body.innerHTML = '<div style="padding:20px">No report data embedded.</div>'; return; }

// ---------------------------------------------------------------------------
// data
// ---------------------------------------------------------------------------
const VC = { saturated: '#ef4444', tight: '#f59e0b', spare: '#22c55e', upstream: '#3b82f6',
  undertrained: '#a855f7', redundant: '#ec4899', oversmoothed: '#06b6d4', passthrough: '#6b7280',
  narrow: '#94a3b8', none: '#475569' };
const VERDICTS = ['saturated', 'tight', 'spare', 'upstream', 'undertrained', 'redundant', 'oversmoothed', 'passthrough', 'narrow'];
const M = {};
DATA.modules.forEach(m => { M[m.name] = m; });
const H = {};
const KIDS = {};
DATA.hierarchy.forEach(h => { H[h.name] = h; KIDS[h.name] = []; });
DATA.hierarchy.forEach(h => { if (h.parent !== null && h.parent !== undefined && KIDS[h.parent]) KIDS[h.parent].push(h.name); });
// graph nodes: leaves, plus containers that build their own output (`emits`)
const NODES = DATA.modules.filter(m => m.is_leaf || m.emits).map(m => m.name);
const isNode = m => !!(m && (m.is_leaf || m.emits));
const CONTAINERS = DATA.hierarchy.filter(h => !h.is_leaf && h.name !== '').map(h => h.name);
const EDGES = DATA.edges;
const CKA_IDX = {};
(DATA.cka.names || []).forEach((n, i) => { CKA_IDX[n] = i; });

const state = { selected: null, leavesOnly: false, collapsed: new Set(), sort: 'priority', sortDir: -1,
  search: '', view: 'graph', tx: 40, ty: 40, k: 1 };

function ancestors(name) {           // outermost first, excluding root ''
  const out = []; const parts = name.split('.');
  for (let i = 1; i < parts.length; i++) out.push(parts.slice(0, i).join('.'));
  return out;
}
function isRelative(a, b) { return a === b || a.startsWith(b + '.') || b.startsWith(a + '.'); }
function shortName(n) { const i = n.lastIndexOf('.'); return i < 0 ? n : n.slice(i + 1); }
function fmt(x, d) { if (x === null || x === undefined || Number.isNaN(x)) return '–'; if (typeof x !== 'number') return String(x); if (Number.isInteger(x)) return String(x); return x.toFixed(d === undefined ? 3 : d); }
function pct(x) { return (x === null || x === undefined) ? '–' : Math.round(100 * x) + '%'; }
function fmtParams(n) { if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k'; return String(n); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function colorOf(m) { return VC[(m && m.verdict) || 'none'] || VC.none; }
function execOf(name) {
  if (M[name]) return M[name].exec_order;
  let best = Infinity;
  DATA.modules.forEach(m => { if (m.name.startsWith(name + '.') && m.exec_order < best) best = m.exec_order; });
  return best === Infinity ? 1e9 : best;
}

// ---------------------------------------------------------------------------
// header / warnings / legend
// ---------------------------------------------------------------------------
document.getElementById('meta').textContent =
  `${DATA.meta.model} · ${fmtParams(DATA.meta.n_params)} params · ${DATA.modules.length} modules · ${EDGES.length} edges` +
  (DATA.meta.base_loss !== null && DATA.meta.base_loss !== undefined ? ` · base loss ${DATA.meta.base_loss.toFixed(4)}` : '');
const wb = document.getElementById('warnbox');
if (DATA.warnings && DATA.warnings.length) { wb.classList.add('show'); wb.innerHTML = DATA.warnings.map(w => '<div>⚠ ' + esc(w) + '</div>').join(''); }
const hl = document.getElementById('headline');
if (DATA.meta.headline && DATA.meta.headline.length) { hl.classList.add('show'); hl.innerHTML = '<b>Reading:</b> ' + DATA.meta.headline.map(esc).join(' '); }
document.getElementById('legend').innerHTML = VERDICTS.map(v => `<span><i style="background:${VC[v]}"></i>${v}</span>`).join('');

// ---------------------------------------------------------------------------
// graph: visibility, projection, layout
// ---------------------------------------------------------------------------
function visibleNodeOf(leaf) {
  if (!state.leavesOnly) {
    const anc = ancestors(leaf);
    for (const a of anc) if (state.collapsed.has(a)) return a;
  }
  return leaf;
}
function projectedGraph() {
  const nodes = new Set();
  NODES.forEach(l => nodes.add(visibleNodeOf(l)));
  const edgeSet = new Map();
  EDGES.forEach(([u, v]) => {
    const U = visibleNodeOf(u), V = visibleNodeOf(v);
    if (U === V) return;
    if (!nodes.has(U) || !nodes.has(V)) return;
    const key = U + '␀' + V;
    if (!edgeSet.has(key)) edgeSet.set(key, [U, V]);
  });
  return { nodes: [...nodes], edges: [...edgeSet.values()] };
}
const NODE_W = 172, NODE_H = 48, XGAP = 80, YGAP = 26;
function layoutGraph(g) {
  const ord = {}; g.nodes.forEach(n => { ord[n] = execOf(n); });
  const nodes = g.nodes.slice().sort((a, b) => ord[a] - ord[b] || (a < b ? -1 : 1));

// drag a section by its header to reorder; the order is remembered
let dragSec = null;
right.addEventListener('dragstart', ev => {
  const sec = ev.target.closest('.sec'); if (!sec) return;
  dragSec = sec; sec.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', sec.getAttribute('data-sec'));
});
function dropSide(ev, sec) {
  const r = sec.getBoundingClientRect();
  const col = !document.body.classList.contains('below') || getComputedStyle(right.querySelector('.secs')).gridTemplateColumns.split(' ').length === 1;
  const before = col ? (ev.clientY < r.top + r.height / 2) : (ev.clientX < r.left + r.width / 2);
  return { before, col };
}
right.addEventListener('dragover', ev => {
  const sec = ev.target.closest('.sec'); if (!dragSec || !sec || sec === dragSec) return;
  ev.preventDefault(); ev.dataTransfer.dropEffect = 'move';
  const { before, col } = dropSide(ev, sec);
  right.querySelectorAll('.sec').forEach(x => x.classList.remove('dropbefore', 'dropafter', 'col'));
  sec.classList.add(before ? 'dropbefore' : 'dropafter'); if (col) sec.classList.add('col');
});
right.addEventListener('dragleave', ev => { const sec = ev.target.closest('.sec'); if (sec && !sec.contains(ev.relatedTarget)) sec.classList.remove('dropbefore', 'dropafter', 'col'); });
right.addEventListener('drop', ev => {
  const sec = ev.target.closest('.sec'); if (!dragSec || !sec || sec === dragSec) return;
  ev.preventDefault();
  const { before } = dropSide(ev, sec);
  sec.parentElement.insertBefore(dragSec, before ? sec : sec.nextSibling);
  prefs.order = [...right.querySelectorAll('.sec')].map(x => x.getAttribute('data-sec')); savePrefs();
  right.querySelectorAll('.sec').forEach(x => x.classList.remove('dropbefore', 'dropafter', 'col'));
});
right.addEventListener('dragend', () => { if (dragSec) dragSec.classList.remove('dragging'); dragSec = null; right.querySelectorAll('.sec').forEach(x => x.classList.remove('dropbefore', 'dropafter', 'col')); });

// chart hover: crosshair + live values, from the data each chart embeds
function hoverLayer(F) { return `<line class="xh" x1="0" y1="${F.y0}" x2="0" y2="${F.y1}"/><circle class="xm" r="3"/><rect class="hoverpad" x="${F.x0}" y="${F.y0}" width="${F.x1 - F.x0}" height="${F.y1 - F.y0}"/>`; }
function chartData(F, xs, ys, xscale, yscale, kind, extra) {
  return esc(JSON.stringify({ F: { x0: F.x0, x1: F.x1, y0: F.y0, y1: F.y1, w: F.w, h: F.h }, xs, ys, xscale, yscale, kind, ...(extra || {}) }));
}
right.addEventListener('mousemove', ev => {
  const svgEl = ev.target.closest('svg[data-chart]');
  if (!svgEl) { right.querySelectorAll('.xh, .xm').forEach(e => { e.style.opacity = 0; }); if (tip.dataset.chart) { tip.style.display = 'none'; delete tip.dataset.chart; } return; }
  const d = JSON.parse(svgEl.getAttribute('data-chart'));
  const r = svgEl.getBoundingClientRect(); const sc = Math.min(r.width / d.F.w, r.height / d.F.h); const vx = (ev.clientX - r.left - (r.width - d.F.w * sc) / 2) / sc;
  const xsc = d.xscale === 'log' ? scaleLog(d.xdom[0], d.xdom[1], d.F.x0, d.F.x1) : scaleLin(d.xdom[0], d.xdom[1], d.F.x0, d.F.x1);
  const ysc = d.yscale === 'log' ? scaleLog(d.ydom[0], d.ydom[1], d.F.y1, d.F.y0) : scaleLin(d.ydom[0], d.ydom[1], d.F.y1, d.F.y0);
  let best = 0, bd = Infinity;
  d.xs.forEach((x, i) => { const dx = Math.abs(xsc(x) - vx); if (dx < bd) { bd = dx; best = i; } });
  const x = d.xs[best], y = d.ys[best];
  const px = xsc(x), py = ysc(d.yscale === 'log' ? Math.max(y, d.ydom[0]) : y);
  const xh = svgEl.querySelector('.xh'), xm = svgEl.querySelector('.xm');
  if (xh) { xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.opacity = 1; }
  if (xm) { xm.setAttribute('cx', px); xm.setAttribute('cy', py); xm.style.opacity = 1; }
  let text;
  if (d.kind === 'spectrum') text = `σ[${x}] = ${y.toPrecision(4)}\n${(100 * y / d.ys[0]).toFixed(2)}% of σ_max`;
  else if (d.kind === 'cum') text = `rank ${x}\n${(100 * y).toFixed(2)}% variance explained`;
  else if (d.kind === 'sweep') text = `rank k = ${x}\nloss ${y.toPrecision(5)}\n${((y / d.base - 1) * 100).toFixed(2)}% vs base${y <= d.thr ? '  (within tolerance)' : ''}`;
  else if (d.kind === 'hist') text = `[${d.edges[best].toPrecision(3)}, ${d.edges[best + 1].toPrecision(3)})\ncount ${y}  (${(100 * y / d.total).toFixed(2)}%)`;
  else text = `${x}: ${y}`;
  tip.textContent = text; tip.dataset.chart = '1';
  tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
});
right.addEventListener('mouseleave', () => { if (tip.dataset.chart) { tip.style.display = 'none'; delete tip.dataset.chart; } });

// the guide's text for one section: everything between its <h2 id> and the next <h2>
const GUIDE_TEXT = {};
(function () {
  const body = document.querySelector('#guide .body'); if (!body) return;
  let cur = null;
  [...body.children].forEach(el => {
    if (el.tagName === 'H2') { cur = el.id || null; if (cur) GUIDE_TEXT[cur] = ''; return; }
    if (cur) GUIDE_TEXT[cur] += el.outerHTML;
  });
})();
function explain(guideId) {
  const t = GUIDE_TEXT[guideId]; if (!t) return '';
  const open = !(prefs.explainClosed && prefs.explainClosed[guideId]);
  return `<details class="explain" data-explain="${guideId}" ${open ? 'open' : ''}><summary>From the guide</summary>${t}</details>`;
}
right.addEventListener('toggle', ev => {
  const d = ev.target; if (!d.classList || !d.classList.contains('explain')) return;
  prefs.explainClosed = prefs.explainClosed || {}; prefs.explainClosed[d.getAttribute('data-explain')] = !d.open; savePrefs();
}, true);

right.addEventListener('click', ev => {
  const g = ev.target.closest('[data-guide]');
  if (g) { ev.stopPropagation(); showGuide(true, g.getAttribute('data-guide')); return; }
  const tb = ev.target.closest('[data-secs]');
  if (tb) {
    const what = tb.getAttribute('data-secs');
    if (what === 'reset') { delete prefs.order; savePrefs(); renderDetail(); return; }
    prefs.closed = prefs.closed || {};
    right.querySelectorAll('.sec').forEach(sec => { sec.classList.toggle('closed', what === 'close'); prefs.closed[sec.getAttribute('data-sec')] = what === 'close'; });
    savePrefs(); return;
  }
  const h = ev.target.closest('.sech');
  if (h && !ev.target.closest('.grip')) { const sec = h.parentElement; sec.classList.toggle('closed'); prefs.closed = prefs.closed || {}; prefs.closed[sec.getAttribute('data-sec')] = sec.classList.contains('closed'); savePrefs(); return; }
  const a = ev.target.closest('[data-name]'); if (a) { ev.preventDefault(); select(a.getAttribute('data-name')); }
});

// ---------------------------------------------------------------------------
// similarity heatmap
// ---------------------------------------------------------------------------
const heat = document.getElementById('heat');
const tip = document.getElementById('tip');
function heatColor(v) {
  if (v === null || v === undefined) return '#0b0f17';
  const t = Math.max(0, Math.min(1, v));
  // light (0) -> deep dark blue (1): redundant blocks appear as dark squares
  const c0 = [226, 232, 240], c1 = [15, 23, 42];
  const g = Math.pow(t, 1.6);
  const c = c0.map((a, i) => Math.round(a + (c1[i] - a) * g));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function renderHeat() {
  if (state.view !== 'heat') return;
  let names = (DATA.cka.names || []).slice();
  if (state.leavesOnly) names = names.filter(n => isNode(M[n]));
  names.sort((a, b) => execOf(a) - execOf(b));
  if (!names.length) { heat.innerHTML = '<div class="empty">No CKA data (no activations captured).</div>'; return; }
  const n = names.length; const cellSz = Math.max(8, Math.min(26, Math.floor(700 / n)));
  const lab = 150; const W = lab + n * cellSz + 20, Hh = lab + n * cellSz + 20;
  let s = `<svg viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" id="heatsvg" style="font-family:var(--mono)">`;
  names.forEach((nm, i) => {
    const sel = nm === state.selected;
    s += `<text x="${lab - 4}" y="${lab + i * cellSz + cellSz * 0.7}" text-anchor="end" font-size="${Math.min(11, cellSz - 1)}" fill="${sel ? '#93c5fd' : colorOf(M[nm])}" data-name="${esc(nm)}" style="cursor:pointer">${esc(nm)}</text>`;
    s += `<text transform="translate(${lab + i * cellSz + cellSz * 0.7},${lab - 4}) rotate(-90)" font-size="${Math.min(11, cellSz - 1)}" fill="${sel ? '#93c5fd' : colorOf(M[nm])}" data-name="${esc(nm)}" style="cursor:pointer">${esc(nm)}</text>`;
  });
  names.forEach((a, i) => names.forEach((b, j) => {
    const v = DATA.cka.matrix[CKA_IDX[a]][CKA_IDX[b]];
    const hl = state.selected && (a === state.selected || b === state.selected);
    s += `<rect x="${lab + j * cellSz}" y="${lab + i * cellSz}" width="${cellSz}" height="${cellSz}" fill="${heatColor(v)}" stroke="${hl ? '#93c5fd' : '#0b0f17'}" stroke-width="${hl ? 1 : 0.5}" data-a="${esc(a)}" data-b="${esc(b)}" data-v="${v === null || v === undefined ? '' : v}"/>`;
  }));
  // legend
  const lx = lab, ly = lab + n * cellSz + 6;
  for (let i = 0; i < 20; i++) s += `<rect x="${lx + i * 8}" y="${ly}" width="8" height="8" fill="${heatColor(i / 19)}"/>`;
  s += `<text x="${lx}" y="${ly + 8}" font-size="9" fill="#94a3b8" dx="${20 * 8 + 4}">CKA 0 → 1 (dark = similar; > 0.98 with an unrelated module = redundant)</text>`;
  s += '</svg>';
  heat.innerHTML = `<div class="hint">Linear CKA between the outputs of every captured module (rows sampled identically). Hover for values, click a cell or label to select.</div>` + s;
}
heat.addEventListener('mousemove', ev => {
  const r = ev.target.closest('rect[data-a]');
  if (!r) { tip.style.display = 'none'; return; }
  const v = r.getAttribute('data-v');
  tip.textContent = `${r.getAttribute('data-a')}\n${r.getAttribute('data-b')}\nCKA ${v === '' ? 'n/a (rows not aligned)' : (+v).toFixed(4)}`;
  tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
});
heat.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
heat.addEventListener('click', ev => {
  const r = ev.target.closest('rect[data-a]'); if (r) { select(r.getAttribute('data-a')); return; }
  const t = ev.target.closest('[data-name]'); if (t) select(t.getAttribute('data-name'));
});

// tabs
const center = document.getElementById('center');
function setView(v) {
  state.view = v;
  document.getElementById('tab-graph').classList.toggle('active', v === 'graph');
  document.getElementById('tab-heat').classList.toggle('active', v === 'heat');
  center.classList.toggle('heat', v === 'heat'); heat.classList.toggle('show', v === 'heat');
  document.getElementById('graphtools').style.display = v === 'heat' ? 'none' : '';
  document.getElementById('legend').style.display = v === 'heat' ? 'none' : '';
  if (v === 'heat') renderHeat(); else fitView();
}
document.getElementById('tab-graph').addEventListener('click', () => setView('graph'));
document.getElementById('tab-heat').addEventListener('click', () => setView('heat'));
window.addEventListener('resize', () => { if (state.view === 'graph') fitView(); });

// ---------------------------------------------------------------------------
// layout: resizable sidebars, detail panel as sidebar or as a section below
// ---------------------------------------------------------------------------
const mainEl = document.querySelector('main');
const belowEl = document.getElementById('below');
const moveBtn = document.getElementById('moveDetail');
const prefs = (() => { try { return JSON.parse(localStorage.getItem('capscope.layout') || '{}') || {}; } catch (e) { return {}; } })();
function savePrefs() { try { localStorage.setItem('capscope.layout', JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ } }
function applyWidths() {
  if (prefs.leftw) mainEl.style.setProperty('--leftw', prefs.leftw + 'px');
  if (prefs.rightw) mainEl.style.setProperty('--rightw', prefs.rightw + 'px');
}
function setBelow(on) {
  document.body.classList.toggle('below', on);
  document.documentElement.classList.toggle('below', on);
  (on ? belowEl : mainEl).appendChild(right);
  moveBtn.textContent = on ? 'Panel right' : 'Panel below';
  moveBtn.classList.toggle('active', on);
  prefs.below = on; savePrefs();
  requestAnimationFrame(() => { if (state.view === 'graph') fitView(); else renderHeat(); });
}
moveBtn.addEventListener('click', () => setBelow(!document.body.classList.contains('below')));
function gutterDrag(gutter, side) {
  gutter.addEventListener('mousedown', ev => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    document.body.classList.add('resizing');
    const move = e => {
      const r = mainEl.getBoundingClientRect();
      const max = Math.max(240, r.width * 0.6);
      const w = Math.round(Math.min(max, Math.max(180, side === 'left' ? e.clientX - r.left : r.right - e.clientX)));
      prefs[side === 'left' ? 'leftw' : 'rightw'] = w; applyWidths();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); document.body.classList.remove('resizing'); savePrefs(); if (state.view === 'graph') fitView(); };
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
  });
}
gutterDrag(document.getElementById('gutL'), 'left');
gutterDrag(document.getElementById('gutR'), 'right');
applyWidths();
if (prefs.below) setBelow(true);

// ---------------------------------------------------------------------------
// boot
// ---------------------------------------------------------------------------
renderList(); renderGraph(); fitView();
const top = DATA.modules.slice().sort((a, b) => b.priority - a.priority || a.exec_order - b.exec_order)[0];
if (top) select(top.name);
fitView();
// guide modal
const guide = document.getElementById('guide');
function showGuide(on, anchor) {
  guide.classList.toggle('show', on);
  if (!on) return;
  const body = guide.querySelector('.body'); body.focus();
  const el = anchor ? document.getElementById(anchor) : null;
  if (el) el.scrollIntoView({ block: 'start' }); else body.scrollTop = 0;
}
document.getElementById('guideBtn').addEventListener('click', () => showGuide(true));
document.getElementById('guideClose').addEventListener('click', () => showGuide(false));
guide.addEventListener('click', ev => { if (ev.target === guide) showGuide(false); });
window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && guide.classList.contains('show')) showGuide(false); });
guide.querySelector('.body').setAttribute('tabindex', '-1');

window.capscope = { state, data: DATA, select, renderGraph, renderHeat, setView, fitView, setBelow, showGuide };
})();
</script>
</body>
